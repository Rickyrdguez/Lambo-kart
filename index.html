<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Juego de carreras 3D en el navegador con un Lamborghini y multijugador online.">
<title>Lambo Kart</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
<!-- PeerJS: conexiones directas entre navegadores (WebRTC) para jugar online -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<div id="ui">
  <h1>LAMBO KART</h1>

  <div class="card" id="name-row">
    <label>Tu nombre <input id="name" maxlength="14" placeholder="Escribe tu nombre"></label>
  </div>

  <div class="card" id="scr-main">
    <button class="primary" id="btn-solo">Jugar solo</button>
    <button id="btn-create">Iniciar partida</button>
    <button id="btn-join">Unirse a partida</button>
    <p class="hint">Flechas / WASD: conducir · Espacio: usar objeto · Esc: salir</p>
  </div>

  <div class="card hidden" id="scr-join">
    <h2>Unirse a partida</h2>
    <label>Código de la partida <input id="code" maxlength="5" placeholder="ABCDE" autocomplete="off"></label>
    <button class="primary" id="btn-join-go">Unirse</button>
    <button class="ghost" data-back>Volver</button>
  </div>

  <div class="card hidden" id="scr-lobby">
    <h2>Sala de espera <span id="player-count"></span></h2>
    <div id="share">
      <p class="hint">Comparte este código con tus amigos</p>
      <div class="code-big" id="code-big"></div>
      <input id="link" readonly>
      <div class="row">
        <button id="btn-copy-link">Copiar enlace</button>
        <button id="btn-copy-code">Copiar código</button>
      </div>
    </div>
    <ul id="players"></ul>
    <button class="primary" id="btn-start">Empezar carrera</button>
    <p class="hint" id="lobby-wait">Esperando a que el anfitrión empiece la carrera…</p>
    <button class="ghost" data-back>Salir</button>
  </div>

  <p id="status"></p>
</div>

<script>
  // Los módulos de JavaScript no funcionan abriendo el archivo con doble clic
  if (location.protocol === 'file:') {
    document.getElementById('status').textContent =
      'Abre el juego con "npm start" o desde la web publicada: los navegadores no cargan módulos desde un archivo local.';
    document.getElementById('status').className = 'error';
  }
</script>
</body>
</html>
