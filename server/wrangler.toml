# Configuración de Cloudflare Workers para el servidor de reenvío.
# Publicar: npx wrangler deploy   (desde esta carpeta)
name = "lambokart"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
